<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorium Galvaza: instrumen visual IPA untuk SMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Identitas: kanvas gelap seperti layar alat ukur, panel kertas dengan skala penggaris (motif tick), satu aksen hijau reagen. */
:root{--ink:#0f1a20;--ink2:#1b2a33;--paper:#f2eee4;--mute:#464e54;--acc:#c6f432;--hud:#e8eef2}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:500 15px/1.3 "Bricolage Grotesque",system-ui,sans-serif;background:var(--ink);color:var(--ink);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px #fff}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,58fr) 8px minmax(0,42fr);grid-template-areas:"hd" "cv" "rl" "pn";padding-top:env(safe-area-inset-top)}
.hd{grid-area:hd;padding:6px 10px 8px;color:var(--hud)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px}
h1{font-size:17px;font-weight:700;letter-spacing:.01em}
#calm{background:transparent;color:var(--hud);border:1.5px solid #6b7c86;border-radius:8px;padding:0 10px;min-height:44px;font-size:12px}
#calm[aria-pressed=true]{background:var(--hud);color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{background:var(--ink2);color:#dce5ea;border-radius:10px;min-height:48px;padding:4px 6px;display:grid;line-height:1.15;text-align:center}
.tabs b{font-size:14px}.tabs span{font-size:12px}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--ink)}
.cvw{grid-area:cv;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--hud);background:var(--ink)}
.rule{grid-area:rl;background:var(--paper) repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10px) 0 0/100% 5px no-repeat}
.pn{grid-area:pn;background:var(--paper);padding:2px 14px calc(8px + env(safe-area-inset-bottom));overflow-y:auto}
.p{display:grid;gap:2px}.p[hidden]{display:none}
.sl span{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:4px}
output{font:500 13px "DM Mono",ui-monospace,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--trk,linear-gradient(90deg,var(--ink) var(--p,50%),#b7b09f var(--p,50%)))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--trk,linear-gradient(90deg,var(--ink) var(--p,50%),#b7b09f var(--p,50%)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:7px;background:var(--acc);border:3px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:7px;background:var(--acc);border:3px solid var(--ink)}
.phs{--trk:linear-gradient(90deg,#b3121f,#ee5a1c 20%,#f3c93a 40%,#3da552 55%,#1d9aa0 65%,#2a5bd0 78%,#40228f)}
.seg,.row{display:grid;gap:8px;margin-top:4px}
.seg{grid-template-columns:1fr 1fr}.row{grid-template-columns:1.4fr 1fr 1fr}
.seg button,.row button,.wide,.sg button{min-height:46px;border-radius:9px;background:#e1dccd;font-weight:700;border:2px solid var(--ink)}
.seg button[aria-pressed=true],.sg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.pri{background:var(--acc)!important}.wide{width:100%;margin-top:6px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.sg button{display:grid;gap:0;padding:2px 4px;font-size:13px;line-height:1.15}
.sg small{font:500 12px "DM Mono",ui-monospace,monospace}
.sg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.sg button[aria-pressed=true] i{border-color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px}
.chips button{flex:none;min-height:44px;padding:0 12px;border-radius:9px;background:#e1dccd;border:2px solid var(--ink);font-weight:700}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--acc)}
.card{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.card h2{grid-column:1/-1;font-size:15px}
.card dt{color:var(--mute);font-size:12px}.card dd{font:500 13px "DM Mono",ui-monospace,monospace}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:860px){
 .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hd hd" "cv pn"}
 .rule{display:none}.hd{padding:10px 18px}.tabs{max-width:640px}.pn{padding-top:12px}
}
@media (max-height:700px){.tabs button{min-height:44px}.p{gap:0}.sg button,.seg button,.row button{min-height:44px}}
</style>
</head>
<body>
<div class="app">
 <header class="hd">
  <div class="top"><h1>Laboratorium Galvaza</h1><button id="calm" aria-pressed="false">Hentikan gerak latar</button></div>
  <nav class="tabs" role="tablist" aria-label="Instrumen simulasi">
   <button role="tab" id="t0" aria-selected="true" aria-controls="p0" aria-label="Fisika: Gaya dan Gerak"><b>Fisika</b><span>Gaya &amp; Gerak</span></button>
   <button role="tab" id="t1" aria-selected="false" aria-controls="p1" aria-label="Astronomi: Tata Surya 3D" tabindex="-1"><b>Astronomi</b><span>Tata Surya 3D</span></button>
   <button role="tab" id="t2" aria-selected="false" aria-controls="p2" aria-label="Kimia: Asam dan Basa" tabindex="-1"><b>Kimia</b><span>Asam &amp; Basa</span></button>
  </nav>
 </header>
 <main class="cvw">
  <canvas id="cv" role="img" aria-label=""></canvas>
  <p class="err" id="err" hidden>Peramban ini tidak bisa menggambar kanvas. Buka di Chrome, Safari, atau Firefox versi terbaru.</p>
 </main>
 <div class="rule" aria-hidden="true"></div>
 <section class="pn" aria-label="Panel kontrol">
  <div class="p" role="tabpanel" id="p0" aria-labelledby="t0">
   <label class="sl"><span>Massa benda <output id="mo">5 kg</output></span><input id="m" type="range" min="1" max="20" step="1" value="5"></label>
   <label class="sl"><span>Gaya dorong <output id="fo">30 N</output></span><input id="f" type="range" min="0" max="100" step="1" value="30"></label>
   <div class="seg" role="group" aria-label="Permukaan lintasan"><button data-s="0" aria-pressed="true">Licin</button><button data-s="1" aria-pressed="false">Kasar</button></div>
   <div class="row"><button id="go" class="pri">Mulai</button><button id="pz" disabled>Jeda</button><button id="rs">Reset</button></div>
  </div>
  <div class="p" role="tabpanel" id="p1" aria-labelledby="t1" hidden>
   <label class="sl"><span>Kecepatan waktu <output id="so">1x</output></span><input id="sp" type="range" min="0" max="10" step="0.5" value="1"></label>
   <label class="sl"><span>Zoom <output id="zo">1,0x</output></span><input id="zm" type="range" min="0.5" max="5" step="0.1" value="1"></label>
   <div class="chips" id="chips" role="group" aria-label="Fokus kamera"></div>
   <dl class="card" id="card"></dl>
  </div>
  <div class="p" role="tabpanel" id="p2" aria-labelledby="t2" hidden>
   <div class="sg" id="smp" role="group" aria-label="Sampel sehari-hari"></div>
   <label class="sl"><span>Nilai pH <output id="po">7,0</output></span><input id="ph" class="phs" type="range" min="1" max="14" step="0.1" value="7"></label>
   <button id="dip" class="wide pri" aria-pressed="false">Celupkan Kertas Lakmus</button>
   <p class="note" id="lit">Kertas lakmus belum dicelup.</p>
  </div>
 </section>
</div>
<p class="sr" id="sr" aria-live="polite"></p>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),cx=cv.getContext('2d');
if(!cx){$('#err').hidden=false;throw new Error('canvas')}
const MONO='"DM Mono",ui-monospace,monospace';
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),wrap=(v,p)=>((v%p)+p)%p,lerp=(a,b,t)=>a+(b-a)*t;
const f1=(n,d=1)=>n.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const sr=t=>{$('#sr').textContent=t};
const sl=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');
const txt=(s,x,y,f,c,a='left')=>{cx.font=f;cx.fillStyle=c;cx.textAlign=a;cx.fillText(s,x,y)};
const rrect=(x,y,w,h,r)=>{cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)};
let W=1,H=1,tab=0,calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(fit).observe(cv);
function arrow(x1,y1,x2,y2,c){const a=Math.atan2(y2-y1,x2-x1);cx.strokeStyle=cx.fillStyle=c;cx.lineWidth=4;cx.lineCap='round';cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2-Math.cos(a)*8,y2-Math.sin(a)*8);cx.stroke();cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2-14*Math.cos(a-.45),y2-14*Math.sin(a-.45));cx.lineTo(x2-14*Math.cos(a+.45),y2-14*Math.sin(a+.45));cx.fill()}

/* ---------- 1. Fisika: Hukum II Newton ---------- */
/* Gesekan kinetik = 0,35 x m x g (g = 9,8 m/s2) pada lantai kasar. Gesekan statis menahan benda selama F lebih kecil dari batas itu. */
const P={m:5,F:30,rough:false,run:false,v:0,s:0,wh:0,sp:[],wd:[],c0:150,bw:100,ty:300,
 calc(){const fm=this.rough?.35*this.m*9.8:0;
  if(this.v<=0&&this.F<=fm)return{a:0,f:this.F,net:0,fm};
  const a=(this.F-fm)/this.m;return{a,f:fm,net:this.F-fm,fm}},
 step(dt){const c=this.calc();
  if(this.run){this.v=Math.max(0,this.v+c.a*dt);this.s+=this.v*dt;this.wh+=this.v*dt/.46}
  for(const p of this.sp){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.l-=dt}
  this.sp=this.sp.filter(p=>p.l>0);
  if(!calm&&this.run&&this.rough&&this.v>.5)for(let i=0;i<2;i++)this.sp.push({x:this.c0+(i?1:-1)*(this.bw/2-22),y:this.ty,vx:-(40+Math.random()*Math.min(this.v,40)*8),vy:-Math.random()*110,l:.4});
  if(!calm&&this.run&&this.v>8&&this.wd.length<18&&Math.random()<.4)this.wd.push({x:W,y:H*(.1+Math.random()*.45),l:30+Math.random()*60});
  for(const w of this.wd)w.x-=(Math.min(this.v,60)*30+300)*dt;
  this.wd=this.wd.filter(w=>w.x+w.l>0)},
 draw(){const fy=H*.66,ty=fy+H*.075,bb=fy+H*.17,PX=26,s=this.s,c0=W*.46,bw=84+this.m*1.7,bh=30+this.m*.5,wr=12,c=this.calc();
  this.c0=c0;this.bw=bw;this.ty=ty;
  let g=cx.createLinearGradient(0,0,0,fy);g.addColorStop(0,'#0b151b');g.addColorStop(1,'#1d303b');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(let x=-wrap(s*PX*.12,170)-170;x<W;x+=170){cx.fillStyle='#14232c';cx.fillRect(x+24,fy*.12,104,fy*.46);cx.fillStyle='#223c49';cx.fillRect(x+30,fy*.12+6,44,fy*.46-12);cx.fillRect(x+78,fy*.12+6,44,fy*.46-12)}
  for(let x=-wrap(s*PX*.4,250)-250;x<W;x+=250){cx.fillStyle='#1b2e38';cx.fillRect(x,fy-46,170,46);cx.fillStyle='#2c4756';cx.beginPath();cx.moveTo(x+30,fy-46);cx.lineTo(x+60,fy-46);cx.lineTo(x+50,fy-70);cx.lineTo(x+40,fy-70);cx.fill();cx.fillRect(x+40,fy-82,10,13);cx.fillRect(x+100,fy-76,26,30)}
  cx.fillStyle='#0e191f';cx.fillRect(0,fy,W,H-fy);
  cx.fillStyle=this.rough?'#4b3c2d':'#2e4755';cx.fillRect(0,fy,W,bb-fy);
  cx.fillStyle=this.rough?'#6a563f':'#4d6b7b';cx.fillRect(0,fy,W,3);
  if(this.rough){cx.fillStyle='#2b2218';const k0=Math.floor(s*PX/9);for(let i=0;i<W/9+2;i++){const k=k0+i;cx.fillRect(i*9-wrap(s*PX,9),fy+8+(k*37%7)*9,4,3)}}
  const L=s-c0/PX,R=s+(W-c0)/PX;
  for(let k=Math.max(0,Math.ceil(L/2)*2);k<=R;k+=2){const x=c0+(k-s)*PX,M=k%10===0;cx.fillStyle='#e8eef2';cx.fillRect(x-1,bb-(M?16:8),2,M?16:8);if(M)txt(k+' m',x,bb+16,'12px '+MONO,'#e8eef2','center')}
  cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(c0+8,ty+2,bw*.6,5,0,0,7);cx.fill();
  const x=c0-bw/2,by=ty-2*wr+2,y=by-bh;
  cx.fillStyle='#9fb1ba';cx.beginPath();cx.moveTo(x+bw,y);cx.lineTo(x+bw+16,y-10);cx.lineTo(x+bw+16,by-10);cx.lineTo(x+bw,by);cx.fill();
  cx.fillStyle='#eef4f6';cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+16,y-10);cx.lineTo(x+bw+16,y-10);cx.lineTo(x+bw,y);cx.fill();
  cx.fillStyle='#c7d4da';cx.fillRect(x,y,bw,bh);cx.fillStyle='#c6f432';cx.fillRect(x,y+bh*.55,bw,4);
  const n=Math.ceil(this.m/5);for(let i=0;i<n;i++){cx.fillStyle=i%2?'#5d7886':'#4a6270';cx.fillRect(x+12,y-10-i*7-1,bw*.6,7)}
  txt(this.m+' kg',c0,y+bh*.4,'700 12px '+MONO,'#0f1a20','center');
  for(const wx of[x+22,x+bw-22]){const wy=ty-wr;cx.fillStyle='#0d1519';cx.beginPath();cx.arc(wx,wy,wr,0,7);cx.fill();cx.strokeStyle='#e8eef2';cx.lineWidth=2;cx.stroke();
   for(let i=0;i<4;i++){const a=this.wh+i*Math.PI/2;cx.beginPath();cx.moveTo(wx,wy);cx.lineTo(wx+Math.cos(a)*(wr-2),wy+Math.sin(a)*(wr-2));cx.stroke()}
   cx.fillStyle='#c6f432';cx.beginPath();cx.arc(wx,wy,3,0,7);cx.fill()}
  cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1.5;
  for(const w of this.wd){cx.globalAlpha=.5;cx.beginPath();cx.moveTo(w.x,w.y);cx.lineTo(w.x+w.l*(1+this.v/40),w.y);cx.stroke()}cx.globalAlpha=1;
  if(this.F>0){const len=10+this.F*.85,ax=x-8,ay=y+bh/2;arrow(ax-len,ay,ax,ay,'#ff3b30');txt('F '+this.F+' N',ax-len,ay-10,'12px '+MONO,'#ff9a92')}
  if(this.rough&&c.f>0){const len=10+c.f*.85,ax=x+bw-10,ay=ty+14;arrow(ax,ay,ax-len,ay,'#ffa726');txt('f '+f1(c.f)+' N',ax-len,ay+18,'12px '+MONO,'#ffc880')}
  for(const p of this.sp){cx.strokeStyle=p.l>.2?'#ff3b30':'#ffa726';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);cx.stroke()}
  rrect(10,10,Math.min(W-20,236),98,10);cx.fillStyle='rgba(8,14,18,.82)';cx.fill();
  txt('a = '+f1(c.a)+' m/s²',20,30,'500 14px '+MONO,'#e8eef2');
  txt('v = '+f1(this.v)+' m/s',20,49,'500 14px '+MONO,'#e8eef2');
  txt('s = '+f1(this.s)+' m',20,68,'500 14px '+MONO,'#e8eef2');
  txt('F bersih = m × a',20,88,'500 12px '+MONO,'#c6f432');
  txt(f1(c.net)+' N = '+this.m+' kg × '+f1(c.a)+' m/s²',20,102,'500 12px '+MONO,'#c6f432');
  const hint=this.run&&this.v<=0&&this.F<=c.fm&&this.rough?'Gaya dorong belum melawan gesekan: kendaraan diam.':(!this.run&&this.s===0?'Siap. Atur massa dan gaya, lalu tekan Mulai.':'');
  if(hint)txt(hint,W/2,H-12,'500 13px "Bricolage Grotesque",system-ui,sans-serif','#d5e0e6','center')},
 reset(){this.v=this.s=this.wh=0;this.run=false;this.sp=[];this.wd=[];this.btn()},
 btn(){$('#go').disabled=this.run;$('#go').textContent=this.s>0?'Lanjutkan':'Mulai';$('#pz').disabled=!this.run}
};
$('#m').oninput=e=>{P.m=+e.target.value;$('#mo').textContent=P.m+' kg';sl(e.target)};
$('#f').oninput=e=>{P.F=+e.target.value;$('#fo').textContent=P.F+' N';sl(e.target)};
$$('.seg button').forEach(b=>b.onclick=()=>{P.rough=b.dataset.s==='1';$$('.seg button').forEach(o=>o.setAttribute('aria-pressed',o===b));sr('Permukaan '+(P.rough?'kasar':'licin'))});
$('#go').onclick=()=>{P.run=true;P.btn();sr('Simulasi berjalan')};
$('#pz').onclick=()=>{P.run=false;P.btn();sr('Simulasi dijeda')};
$('#rs').onclick=()=>{P.reset();sr('Simulasi diatur ulang')};

/* ---------- 2. Astronomi: Tata Surya 3D (proyeksi perspektif sendiri) ---------- */
/* Jarak orbit dan ukuran dimampatkan agar semua planet terlihat. Rasio kala revolusi antarplanet memakai data sebenarnya. */
const PL=[
{n:'Matahari',c:'#ffb020',r:24,o:0,d:0,dm:'1.392.700 km',j:'Pusat sistem',rt:'±25 hari',rv:'-',z:1.2},
{n:'Merkurius',c:'#9a948d',r:3.4,o:52,d:88,dm:'4.879 km',j:'57,9 juta km',rt:'58,6 hari',rv:'88 hari',sp:'#6f6a64',z:3.4},
{n:'Venus',c:'#e3c27a',r:5.8,o:82,d:224.7,dm:'12.104 km',j:'108,2 juta km',rt:'243 hari',rv:'224,7 hari',sp:'#c9a257',z:3.4},
{n:'Bumi',c:'#3b7dd8',r:6,o:112,d:365.25,dm:'12.756 km',j:'149,6 juta km',rt:'23 jam 56 menit',rv:'365,25 hari',z:3.4},
{n:'Mars',c:'#c4572f',r:4.5,o:142,d:687,dm:'6.792 km',j:'227,9 juta km',rt:'24 jam 37 menit',rv:'687 hari',sp:'#8f3a1e',z:3.4},
{n:'Jupiter',c:'#d4a373',r:14,o:176,d:4331,dm:'142.984 km',j:'778,5 juta km',rt:'9 jam 56 menit',rv:'11,86 tahun',z:2},
{n:'Saturnus',c:'#e2cf9c',r:11.5,o:214,d:10747,dm:'120.536 km',j:'1,43 miliar km',rt:'10 jam 33 menit',rv:'29,46 tahun',z:1.8},
{n:'Uranus',c:'#7fd6d8',r:8.5,o:246,d:30589,dm:'51.118 km',j:'2,87 miliar km',rt:'17 jam 14 menit',rv:'84 tahun',z:1.8},
{n:'Neptunus',c:'#3e63d6',r:8.3,o:276,d:59800,dm:'49.528 km',j:'4,50 miliar km',rt:'16 jam 6 menit',rv:'164,8 tahun',z:1.8}];
const TH0=[0,1.2,2.5,4,5.3,.7,2.2,3.6,5.9];
const STARS=Array.from({length:80},(_,i)=>({x:(Math.sin(i*91.7)*.5+.5),y:(Math.sin(i*37.3+2)*.5+.5),r:.6+(i%4)*.35}));
const S={yaw:.5,pitch:.5,zoom:1,zoomT:1,speed:1,t:0,focus:-1,cx:0,cz:0,base:1,idle:true,
 pos(i,t=this.t){const p=PL[i];if(!i)return[0,0];const a=TH0[i]+t*2*Math.PI/(p.d/365.25*20);return[p.o*Math.cos(a),p.o*Math.sin(a)]},
 step(dt){this.t+=dt*this.speed;this.zoom+=(this.zoomT-this.zoom)*Math.min(1,dt*6);
  const[tx,tz]=this.focus>0?this.pos(this.focus):[0,0];this.cx+=(tx-this.cx)*Math.min(1,dt*5);this.cz+=(tz-this.cz)*Math.min(1,dt*5);
